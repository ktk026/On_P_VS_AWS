apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: accommodation
spec:
  selector:
    matchLabels:
      app: node-exporter
  template:
    metadata:
      labels:
        app: node-exporter
    spec:
      hostNetwork: true
      hostPID: true
      containers:
      - name: node-exporter
        image: prom/node-exporter:latest
        args:
        - --path.rootfs=/host
        ports:
        - containerPort: 9100
          hostPort: 9100
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        volumeMounts:
        - name: host
          mountPath: /host
          readOnly: true
      volumes:
      - name: host
        hostPath:
          path: /
      tolerations:
      - operator: Exists

---
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: accommodation
spec:
  selector:
    app: node-exporter
  ports:
  - port: 9100
    targetPort: 9100
