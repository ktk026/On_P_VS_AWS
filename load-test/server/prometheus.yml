global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: loadtest-node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: loadtest-cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: shoply-target
    metrics_path: /metrics
    static_configs:
      - targets:
          - 54.180.167.159:4000
