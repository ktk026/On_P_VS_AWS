version: "3.9"

services:
  db:
    image: soldesk1184/stays-db:latest
    container_name: stays-db
    environment:
      POSTGRES_DB: stays_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: stays_password
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: soldesk1184/stays-api:latest
    container_name: stays-api
    environment:
      DATABASE_URL: "postgresql://postgres:stays_password@db:5432/stays_db"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "8000:8000"

  app:
    image: soldesk1184/stays-app:latest
    container_name: stays-app
    depends_on:
      - api
    ports:
      - "80:80"

  proxy:
    image: nginx:alpine
    container_name: stays-proxy
    depends_on:
      - api
    ports:
      - "4000:80"
    volumes:
      - ./monitoring/proxy.conf:/etc/nginx/conf.d/default.conf:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

volumes:
  db_data:
  grafana_data:
