services:
  postgres:
    image: postgres:16-alpine
    container_name: msa_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shoply}
      POSTGRES_USER: ${POSTGRES_USER:-shoply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shoply1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shoply}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: msa_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  user:
    image: ghcr.io/${GHCR_OWNER}/shoply-user:${IMAGE_TAG:-latest}
    container_name: msa_user
    env_file: .env
    ports:
      - "4005:4005"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: ghcr.io/${GHCR_OWNER}/shoply-gateway:${IMAGE_TAG:-latest}
    container_name: msa_gateway
    env_file: .env
    ports:
      - "4000:4000"
    depends_on:
      - user

  frontend:
    image: ghcr.io/${GHCR_OWNER}/shoply-frontend:${IMAGE_TAG:-latest}
    container_name: msa_frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

  product:
    image: ghcr.io/${GHCR_OWNER}/shoply-product:${IMAGE_TAG:-latest}
    container_name: msa_product
    env_file: .env
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  inventory:
    image: ghcr.io/${GHCR_OWNER}/shoply-inventory:${IMAGE_TAG:-latest}
    container_name: msa_inventory
    env_file: .env
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy

  order:
    image: ghcr.io/${GHCR_OWNER}/shoply-order:${IMAGE_TAG:-latest}
    container_name: msa_order
    env_file: .env
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy

  payment:
    image: ghcr.io/${GHCR_OWNER}/shoply-payment:${IMAGE_TAG:-latest}
    container_name: msa_payment
    env_file: .env
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
