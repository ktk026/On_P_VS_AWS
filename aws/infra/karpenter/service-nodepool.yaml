apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: service-pool
spec:
  template:
    metadata:
      labels:
        workload-type: karpenter
        role: service
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      requirements:
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["t3.medium"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]