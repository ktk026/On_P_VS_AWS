server {
    listen 80;
    server_name _;

    # Serve static frontend files (already baked in stays-app image)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # Reverse‑proxy API calls to the API service
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health endpoint for Prometheus/Grafana
    location /health {
        proxy_pass http://api:8000/health;
    }
}
